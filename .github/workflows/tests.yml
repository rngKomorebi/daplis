name: Tests

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Same check the release pipeline gates on, run here so it fails on the
      # pull request rather than halfway through a release.
      - name: Ruff
        run: python -m pip install --upgrade pip ruff && python -m ruff check .

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every version the package claims support for in pyproject.toml.
        # Keep these two lists in step when you add or drop a version.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
      with:
        # setuptools_scm derives the version from the tags, and installing
        # the package builds it. A shallow checkout has no tags, so the
        # version would fall back to 0.0.0.
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    # Installed rather than run off the source tree, so the tests exercise
    # what actually ships - including the packaged masks and calibration
    # data, and the version metadata 'daplis.__version__' reads.
    - name: Install the package with test extras
      run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
    - name: Run tests
      run: python -m pytest -q
