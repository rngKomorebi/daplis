[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "daplis"
dynamic = ["version"]
description = "DAPLIS: Data Analysis Package for LInoSpad"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sergei Kulkov", email = "sergei.kulkov23@gmail.com" },
]
keywords = ["timestamp", "analysis", "LinoSPAD2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "komorebi_mpl>=0.0.5",
    "lmfit>=0.9.1",
    "matplotlib>=3.9.0",
    "numpy>=1.22.4",
    "pandas>=1.4.0",
    "pyarrow>=17.0.0",
    "scipy>=1.7.0",
    "seaborn>=0.9.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5",
]
docs = [
    "sphinx>=7",
    "sphinx_rtd_theme>=2",
    "myst-parser>=2",
    "sphinx-math-dollar>=1.2",
]

[project.urls]
Homepage = "https://github.com/rngKomorebi/daplis"
Documentation = "https://rngkomorebi.github.io/daplis/"
Repository = "https://github.com/rngKomorebi/daplis"
Issues = "https://github.com/rngKomorebi/daplis/issues"
Changelog = "https://github.com/rngKomorebi/daplis/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Masks and calibration data live under daplis.params, not next to __init__.py,
# so they need their own entries - a bare "daplis" key would not reach them.
"daplis.params" = [
    "masks/*.txt",
    "calibration_data/*.csv",
    "calibration_data/*.npy",
]

[tool.setuptools_scm]
# The version comes from the git tag. Only match well-formed release tags
# ("v1.4.5"): a stray tag like "v.1.4.5" otherwise aborts the build outright
# with "Can't parse version from tag".
git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
# Superseded code kept for reference only - it is not imported, not
# tested, and not worth linting.
extend-exclude = ["archive"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "D",    # pydocstyle - every public function keeps its docstring
]
ignore = [
    "D105",  # magic methods need no docstring
    "D107",  # __init__ is documented on the class
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; docstrings are optional.
"tests/*" = ["D103"]
